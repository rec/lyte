library_config = "wearable-library.toml"
fps = 60
initial_animation = "prism_limbs"

[midi]
channel = 1

[twinkly]
wearable = {}

[animation_defaults]
activation = "note"

[[animation_defaults.controls]]
source = "note"
parameter = "note"

[[animation_defaults.controls]]
source = "velocity"
parameter = "velocity"
output = [0, 127]

[[animation_defaults.controls]]
source = "breath"
parameter = "breath"
output = [0, 127]

[[animation_defaults.controls]]
source = "pitch_bend"
parameter = "pitch_bend"
output = [-8192, 8191]

[animations.velocity_splash]
selector = "wearable:/velocity_splash.toml"
outputs = { light = "wearable" }

[animations.breath_bloom]
selector = "wearable:/breath_bloom.toml"
outputs = { light = "wearable" }

