# Replace the example Art-Net destination with your node's hostname or IPv4 address.
fps = 30
initial_animation = "idle"

[artnet]
host = "192.0.2.10"
# Logical universe 1 maps to Art-Net wire universe 0.
universe_offset = -1

[dmx.laser]
profile = "fixtures/laser.toml"
universe = 1
start_channel = 1
blackout = { mode = "blackout" }

[dmx.laser.defaults]
mode = "blackout"
pattern = "circle"
zoom = 64
xrot = 64
yrot = 64
zrot = 64
hpos = 64
vpos = 64
color = "blue"

[animations.idle.fixtures]
laser = {}

[animations.circle.fixtures]
laser = { mode = "manual", pattern = "circle", color = "blue" }

[animations.square.fixtures]
laser = { mode = "manual", pattern = "square", color = "red" }
