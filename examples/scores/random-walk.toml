[body.operation]
effect = "random_walk"
speed = 60
variance = 80
bounds = [0, 255]
period = 0
pre_fill = true
seed = 17

[[body.modulation.parameters]]
target = { name = "animation", parameter = "speed" }
unit = "ratio"
scope = "part"
minimum = 0
maximum = 250
default = 60

[[body.modulation.parameters]]
target = { name = "animation", parameter = "variance" }
unit = "ratio"
scope = "part"
minimum = 0
maximum = 255
default = 80

[[body.modulation.parameters]]
target = { name = "animation", parameter = "seed" }
unit = "ratio"
scope = "part"
minimum = 0
maximum = 4294967295
default = 17
