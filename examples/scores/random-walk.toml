# Reusable RandomWalk score. Installation parameters override the exports below.
format = "recs"
version = 4
name = "random_walk"
title = "RandomWalk"
kind = "animation"
parameters = [
  { name = "speed", binding = { name = "animation", parameter = "speed" } },
  { name = "variance", binding = { name = "animation", parameter = "variance" } },
  { name = "seed", binding = { name = "animation", parameter = "seed" } }
]

[[timebases]]
name = "frames"
kind = "physical"
rate = { numerator = 30, denominator = 1 }

[[outputs]]
name = "light"
binding = { light = true }

[outputs.stream]
family = "sampled"
quantity = "light"
timebase = "frames"
components = ["red", "green", "blue"]
interpretation = "drive"

[outputs.stream.layout]
name = "string"
axes = ["x"]
unit = "unitless"
