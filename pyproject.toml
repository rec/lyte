[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyte"
version = "0.1.2"
description = "Small dependency-free Python client for Twinkly generation 2 lights"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pydantic",
    "python-rtmidi>=1.5.8",
    "reccy",
    "tyro>=1.0.15",
]

[project.scripts]
lyte = "lyte.cli:main"

[tool.setuptools.packages.find]
include = ["lyte", "lyte.*"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ty.environment]
root = ["."]
extra-paths = ["type_stubs"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
reccy = { git = "ssh://git@github.com/rec/reccy.git", rev = "446a2c4a6f0437463e4a3e6eaa39b4b5597ec106" }
