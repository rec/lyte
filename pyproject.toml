[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyte"
version = "0.1.2"
description = "Python lighting player for Twinkly pixels and Art-Net DMX instruments"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pydantic",
    "python-rtmidi>=1.5.8",
    "reccy",
    "tyro>=1.0.15",
    "ufor @ https://github.com/rec/ufor/archive/0b88a111b9b02dd696716581dfa0cc68e8cf235c.tar.gz",
]

[project.scripts]
lyte = "lyte.cli:main"

[tool.setuptools.packages.find]
include = ["lyte", "lyte.*"]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]

[tool.ty.environment]
root = ["."]
extra-paths = ["type_stubs"]

[tool.uv]
exclude-newer = "1 week"

[tool.uv.sources]
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }
