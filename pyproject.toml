[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyte"
version = "0.1.2"
description = "Small dependency-free Python client for Twinkly generation 2 lights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3.3",
    "numpy>=2.4.6",
    "pydantic",
    "tyro>=1.0.15",
]

[tool.setuptools.packages.find]
include = ["lyte"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyupgrade>=3.21.2",
    "ruff>=0.15.20",
    "ty>=0.0.56",
]
