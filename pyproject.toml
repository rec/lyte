[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lyte"
version = "0.1.0"
description = "Small dependency-free Python client for Twinkly generation 2 lights"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pydantic",
]

[tool.setuptools.packages.find]
include = ["lyte"]
